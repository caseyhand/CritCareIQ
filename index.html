(function() {

  var err   = document.getElementById("pw-err");
  var gate  = document.getElementById("gate");
  var root  = document.getElementById("root");
  function attempt() {
    if (input.value.trim() === PW) {
      gate.style.display = "none";
      root.style.display = "block";
    } else {
      err.style.display = "block";
      input.value = "";
      input.style.borderColor = "#c8102e";
      setTimeout(function(){ err.style.display="none"; input.style.borderColor="#2a3a4a"; }, 2000);
    }
  }
  btn.addEventListener("click", attempt);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") attempt(); });
  input.focus();
})();

/* ── SVG Line Chart (no external deps) ── */
function SvgChart({ data, lines, yMax=14, height=240 }) {
  const [tip, setTip] = useState(null);
  const PL=44, PR=24, PT=12, PB=38;
  const VW=900, VH=height;
  const cW=VW-PL-PR, cH=VH-PT-PB;
  const xS = i => PL + (data.length<2?cW/2:i/(data.length-1)*cW);
  const yS = v => PT + cH - Math.min(Math.max(v/yMax,0),1)*cH;
  const yTicks = [];
  for(let v=0;v<=yMax;v+=2) yTicks.push(v);

  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:"100%",display:"block"}} onMouseLeave={()=>setTip(null)}>
        {yTicks.map(v=>(
          <g key={v}>
            <line x1={PL} x2={VW-PR} y1={yS(v)} y2={yS(v)} stroke="#1a2a3a" strokeWidth={1}/>
            <text x={PL-6} y={yS(v)+4} textAnchor="end" fill="#8a97ab" fontSize={10}>{v}%</text>
          </g>
        ))}
        <line x1={PL} x2={VW-PR} y1={yS(BENCHMARK)} y2={yS(BENCHMARK)} stroke="#facc15" strokeWidth={1.5} strokeDasharray="6 4"/>
        <text x={VW-PR+4} y={yS(BENCHMARK)+4} fill="#facc15" fontSize={9}>8%</text>
        {data.map((d,i)=>(
          <text key={i} x={xS(i)} y={VH-4} textAnchor="middle" fill={d.partial?"#facc15":"#8a97ab"} fontSize={9}>{d.month}</text>
        ))}
        {lines.map((ln,li)=>{
          const pts=data.map((d,i)=>({x:xS(i),y:yS(d[ln.key]??-999),v:d[ln.key],m:d.month,ok:d[ln.key]!==null&&d[ln.key]!==undefined}));
          const segs=[]; let seg=[];
          pts.forEach(p=>{if(p.ok){seg.push(p);}else{if(seg.length){segs.push(seg);seg=[];}}});
          if(seg.length)segs.push(seg);
          return (
            <g key={li}>
              {segs.map((s,si)=>(
                <polyline key={si} points={s.map(p=>`${p.x},${p.y}`).join(" ")} fill="none" stroke={ln.color} strokeWidth={ln.bold?3:1.5} opacity={0.9}/>
              ))}
              {pts.filter(p=>p.ok).map((p,pi)=>(
                <circle key={pi} cx={p.x} cy={p.y} r={5} fill={ln.color} style={{cursor:"crosshair"}}
                  onMouseEnter={()=>setTip({x:p.x,y:p.y,month:p.m,label:ln.label,val:p.v})}/>
              ))}
            </g>
          );
        })}
      </svg>
      {tip&&(
        <div style={{position:"absolute",top:Math.max(tip.y-50,0),left:Math.min((tip.x/900*100)+2,65)+"%",
          background:"#0f1923",border:"1px solid #2a3a4a",borderRadius:8,padding:"8px 12px",
          fontSize:12,color:"#e2e8f0",pointerEvents:"none",whiteSpace:"nowrap",zIndex:20}}>
          <div style={{color:"#8a97ab",marginBottom:2}}>{tip.month}</div>
          <div style={{fontFamily:"'DM Mono',monospace",fontWeight:600}}>{tip.label}: {tip.val}%</div>
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════
   CCAR — Critical Care Above Replacement (mix-adjusted metrics)
   pool  = sick patients you saw: Level 5 + CC charts (billing)  OR  ESI 1–2 patients (triage; nurse-assigned)
   conv  = CC ÷ pool                           (CC conversion; CC+ = conv ÷ group conv × 100)
   xCC   = pool × baseline conversion          (expected CC)
   CCAR  = CC − xCC                            (counting stat; baseline = pre-series 4.5% | group avg (CCAA) | 8% target)
   See: CC Conversion Metric — Methods Note.
   ══════════════════════════════════════════════════════════════ */
const ESI_BY_NAME = {}; ESI_COUNTS.forEach(e => { ESI_BY_NAME[e.name] = e; });
const CC_LABEL = k => LABEL(k).split(" ")[0];
const POOL_MONTHS = pool => pool==="esi" ? ESI_COMPLETE : CC_MONTH_KEYS;
// per physician-month: cc (billing), pool (by mode), cases (billing), l5, esi (if present)
function ccPoint(p, m, pool){
  const v = p[m]; if(!v) return null;
  const e = ESI_BY_NAME[p.name] && ESI_BY_NAME[p.name][m];
  if (pool==="esi" && !e) return null;
  return { cases:v[0], cc:v[1], l5:v[2], pool: pool==="esi" ? e[1]+e[2] : v[1]+v[2], esi:e||null };
}
const CC_GROUP_BY = {};
function ccGroup(pool){
  if (CC_GROUP_BY[pool]) return CC_GROUP_BY[pool];
  const g = {};
  POOL_MONTHS(pool).forEach(m => {
    let N=0, CC=0, P=0;
    CC_COUNTS.forEach(p => { const x=ccPoint(p,m,pool); if(x){ N+=x.cases; CC+=x.cc; P+=x.pool; } });
    g[m] = { N, CC, P, conv: CC/P, raw: CC/N, cstar: (BENCHMARK/100)*N/P, crepl: REPL_RAW*N/P };
  });
  return (CC_GROUP_BY[pool] = g);
}
function ccWindows(pool){
  const ms = POOL_MONTHS(pool); const w = {}; const n = ms.length;
  for (let i=n; i>=3; i--) { const s = ms.slice(i-3, i); w[`${CC_LABEL(s[0])}–${CC_LABEL(s[2])}`] = s; }
  w["Season"] = ms.slice();
  return w;
}
const ccBase = (g, m, base) => base==="target" ? g[m].cstar : base==="repl" ? g[m].crepl : g[m].conv;
const CC_BASE_LABEL = { group:"CCAA", target:"vs 8% target", repl:"CCAR" };
function ccAgg(p, ms, base, pool){
  const g = ccGroup(pool);
  let cases=0, cc=0, l5=0, P=0, d=0, k=0, e45=0, epts=0, hrs=0;
  ms.forEach(m => { const x=ccPoint(p,m,pool); if(!x) return; cases+=x.cases; cc+=x.cc; l5+=x.l5; P+=x.pool; k++; d += x.cc - x.pool*ccBase(g,m,base);
    if (x.esi){ e45 += x.esi[4]+x.esi[5]; epts += x.esi[0]; hrs += x.esi[6]; } });
  return { cases, cc, l5, pool:P, k, raw: cases?cc/cases:null, conv:P?cc/P:null, l5s: cases?l5/cases:null, e45s: epts?e45/epts:null, hrs, d };
}
const CC_NIGHTS = ["Bianchi, Pollianne","Urban, Colleen"];   // nocturnists: compare to each other and to own trend
function ccReason(p, cur, base, pool, firstWin, gconv){
  const tags = [];
  if (CC_NIGHTS.includes(p.name)) tags.push({t:"Nights", c:"info"});
  const pit = cur.e45s!==null ? cur.e45s >= 0.20 : (cur.l5s!==null && cur.l5s < 0.45);
  if (pit) tags.push({t: cur.e45s!==null ? `PIT-heavy · ${Math.round(cur.e45s*100)}% ESI 4–5` : "PIT signature · check schedule", c:"warn"});
  const first = ccAgg(p, firstWin, base, pool);
  if (first.k===3 && cur.k===3 && cur.d - first.d >= 8) tags.push({t:`${CC_BASE_LABEL[base]} +${(cur.d-first.d).toFixed(0)} vs ${CC_LABEL(firstWin[0])}–${CC_LABEL(firstWin[2])}`, c:"good"});
  const ms = POOL_MONTHS(pool);
  const early = ms.slice(0,3).map(m=>ccPoint(p,m,pool)).filter(Boolean);
  if (early.length>=2){ const ec=early.reduce((s,x)=>s+x.cc,0)/early.reduce((s,x)=>s+x.pool,0); if (cur.conv!==null && (ec-cur.conv)/gconv >= 0.4) tags.push({t:"Review: down vs spring", c:"bad"}); }
  const sick = cur.e45s!==null ? cur.e45s <= 0.10 : (cur.l5s!==null && cur.l5s >= 0.6);
  if (sick && cur.conv!==null && cur.conv < gconv*0.75) tags.push({t:"Review: sick mix, low conversion", c:"bad"});
  return tags;
}
const CC_PILL = { good:["#0a1f0a","#1a5a32","#4ade80"], warn:["#1a1a08","#4a4a10","#facc15"], bad:["#1f0a0a","#5a1a1a","#f87171"], info:["#08101a","#10203a","#60a5fa"] };
const CcPill = ({c,children}) => { const [bg,bd,fg]=CC_PILL[c]; return <span className="pill" style={{background:bg,borderColor:bd,color:fg}}>{children}</span>; };
const ccPct = (x,d=1) => x===null||x===undefined ? "—" : (x*100).toFixed(d)+"%";
const ccSigned = x => (x>0?"+":"")+x.toFixed(1);

function CcDivBar({ v, max }){

  return (

        background:good?"linear-gradient(90deg,#4ade8088,#4ade80)":"linear-gradient(90deg,#f87171,#f8717188)"}}/>

function CcSpark({ p, base, pool }){
  const g = ccGroup(pool); const ms = POOL_MONTHS(pool);
  const W=420, H=120, PL=34, PR=12, PT=10, PB=22;
  const pts = ms.map((m,i)=>{ const x=ccPoint(p,m,pool); return {m, i, c: x&&x.pool?x.cc/x.pool:null, g: ccBase(g,m,base)}; });
  const yMax = Math.max(pool==="esi"?0.45:0.22, ...pts.map(d=>d.c||0), ...pts.map(d=>d.g))*1.05;
  const xS = i => PL + (ms.length<2?0:i/(ms.length-1))*(W-PL-PR);
  const yS = v => PT + (H-PT-PB) - (v/yMax)*(H-PT-PB);
  const segs=[]; let seg=[]; pts.forEach(d=>{ if(d.c!==null) seg.push(d); else { if(seg.length) segs.push(seg); seg=[]; } }); if(seg.length) segs.push(seg);
  const ticks = pool==="esi" ? [0,0.2,0.4] : [0,0.1,0.2];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:460,display:"block"}}>
      {ticks.map(t=> t<=yMax && <g key={t}><line x1={PL} x2={W-PR} y1={yS(t)} y2={yS(t)} stroke="#1a2a3a"/><text x={PL-5} y={yS(t)+3} textAnchor="end" fill="#8a97ab" fontSize="9">{Math.round(t*100)}%</text></g>)}
      <polyline points={pts.map(d=>`${xS(d.i)},${yS(d.g)}`).join(" ")} fill="none" stroke="#facc15" strokeWidth="1.5" strokeDasharray="5 4"/>
      {segs.map((s,i)=><polyline key={i} points={s.map(d=>`${xS(d.i)},${yS(d.c)}`).join(" ")} fill="none" stroke="#c8102e" strokeWidth="2"/>)}
      {pts.filter(d=>d.c!==null).map(d=><circle key={d.i} cx={xS(d.i)} cy={yS(d.c)} r="4" fill="#c8102e" stroke="#080e14" strokeWidth="2"/>)}
      {pts.map(d=><text key={d.i} x={xS(d.i)} y={H-6} textAnchor="middle" fill={d.m===PARTIAL_KEY?"#facc15":"#8a97ab"} fontSize="9">{CC_LABEL(d.m)}</text>)}
    </svg>
  );

      { name:"CCAR — above replacement", tag:"the WAR version · the big number", f:"CC − pool × pre-series conversion",
        what:"Replacement level is how the group documented before the email series: 4.5% raw (Nov '25–Mar '26), applied each month as 4.5% × cases ÷ pool, roughly 7% conversion on this mix. CCAR is your CC charts beyond that benchmark, computed monthly and summed. Positive means above the historical group benchmark on your patients; it does not by itself mean you improved from your own earlier months (the detail view shows that). The group total is charts above the pre-series benchmark, which is one input to judging the project, not proof of its effect. This is the number on the leaderboard.",
        ex:<span>{exName}: <M>{ex[1]} − {pool} × {ccPct(g.crepl)} = {ccSigned(ccar)}</M></span> },
      { name:"vs 8% target", tag:"the to-do list", f:"CC − pool × target conversion",
        what:"Same math with the baseline set to the conversion rate that would put the group at 8%. Sums to the group's gap to goal, so each physician's number is literally their share of the charts we're short.",
        ex:<span>Group, {CC_LABEL(k)}: <M>{g.CC} − {g.CC+g.L5} × {ccPct(g.cstar)} = {ccSigned(g.CC-(g.CC+g.L5)*g.cstar)}</M></span> },
    ]},
    { tier:"Reading it right", items:[
      { name:"Rolling windows", tag:"why one month isn't ranked", f:"3 months pooled, or the season",
        what:"One month of per-physician CC data is mostly noise under any metric — 10 charts either way is a lot of movement on 60 sick patients. Rankings use a 3-month rolling window (≥150 cases); the season view is the most trustworthy. Single-month numbers are shown for context, not ranked.",
        ex:null },
      { name:"Reason codes", tag:"the pills next to a name", f:"",
        what:"Every flag is a prompt for contextual chart review, not a conclusion about a clinician. PIT-heavy = ESI 4–5 share 20%+ (or Level 5 share under 45% when triage data is missing); check the schedule first. Review: down vs spring = conversion down by 40% or more of the group rate versus the first three months. Review: sick mix, low conversion = low-acuity share under 10% and conversion under 75% of group. CCAR +N vs window = the counting stat is up 8+ charts versus the first three-month window. Nights = a different mix (more high-MDM admits), but the night group converts at or above the day group, so compare night physicians to each other.",
        ex:null },
      { name:"Known limits", tag:"what it can't tell you", f:"",
        what:"A Level 5 patient isn't always CC-eligible, and shift type changes the mix. The Level 5 pool is physician-controlled, so under-leveling 4s would flatter conversion; the ESI 1–2 pool avoids that when the weekly sheet is complete, and Level 5 share stays visible either way. No uncertainty intervals are shown: with 60–150 sick patients in a window, a difference of a few charts is within normal month-to-month noise and should be read as a tie. Reliability versus raw CC % isn't proven yet at monthly sample sizes. An internal baseline can't see group-wide under-documentation; the RCM downcode lists and the 8% target are the external check. None of this is used for compensation, scheduling, or evaluation.",
        ex:null },
    ]},
  ];
  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:16,fontWeight:600,color:"#e2e8f0",marginBottom:4}}>Stat Guide</div>
        <div style={{fontSize:12,color:"#8a97ab",maxWidth:720,lineHeight:1.5}}>Every number on the CCAR tab, with the formula and a worked example from {CC_LABEL(k)} '26. Same idea as the advanced stats page on a baseball site: separate what the physician controls from what the schedule handed them.</div>
      </div>

            {t.items.map(c=>(

                  <div style={{fontSize:15,fontWeight:700,color:"#f1f5f9"}}>{c.name}</div>
                  <div style={{fontSize:11,color:"#8a97ab",fontStyle:"italic"}}>{c.tag}</div>
                </div>
                {c.f && <F>{c.f}</F>}
                <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.65}}>{c.what}</div>
                {c.ex && <div style={{fontSize:12,color:"#64748b",borderTop:"1px solid #0f1923",paddingTop:8}}>{c.ex}</div>}
              </div>
            ))}

        </div>
      ))}
      <div style={{fontSize:11,color:"#64748b"}}>Data completeness: provisional &lt;95% coded · near-final 95–98.9% · final ≥99%. Revenue figures elsewhere on the site are illustrative at ${REV_PER_CC} per CC chart ({REV_NOTE}). Full derivation and back-test are in the project's methods note; ask Casey for a copy.</div>
    </div>
  );
}

    const fr=Math.max(ar,floor);
    const proj=Math.round(fr/100*cases);
    return{name:p.name.split(",")[0],cases,ar,fr,actual,proj,gain:proj-actual};
  }).sort((a,b)=>b.gain-a.gain);
  const totActual=scenarioData.reduce((s,d)=>s+d.actual,0);
  const totProj=scenarioData.reduce((s,d)=>s+d.proj,0);
  const totGain=totProj-totActual;

        {tab==="trends"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>Individual Physician Trends</div>
                <div style={{fontSize:12,color:"#8a97ab",marginTop:2}}>Pick a physician to compare against the group line · Yellow dashed = 8% target · every value is in the Full Data Table</div>
              </div>
              <select value={selDr} onChange={e=>setSelDr(e.target.value)}>
                <option value="">Group only</option>
                <option value="__all">All physicians (≥30 cases)</option>
                {PHYSICIANS.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
              </select>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24}}>
              <SvgChart
                data={trendData}
                lines={trendLines}
                yMax={selDr==="__all"?24:16} height={selDr==="__all"?380:300}
              />
            </div>
            {selDr==="__all"&&(
              <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:"8px 16px"}}>
                {chartDrs.map((p,i)=>(
                  <span key={p.name} onClick={()=>setSelDr(p.name)}
                    style={{fontSize:11,color:LINE_COLORS[i%LINE_COLORS.length],cursor:"pointer"}}>
                    ● {p.name.split(",")[0]}
                  </span>
                ))}
              </div>
            )}
            {selDr&&<button onClick={()=>setSelDr("")} style={{marginTop:12,background:"transparent",border:"1px solid #2a3a4a",borderRadius:6,padding:"8px 14px",color:"#8a97ab",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>← Group only</button>}
            <div style={{marginTop:10,fontSize:11,color:"#64748b"}}>{codedLabel(LATEST_FINAL)} · {codedLabel(PARTIAL_KEY)} as of {DATA_ASOF}. Provisional and near-final figures will change as remaining charts are coded, in either direction.</div>
          </div>
        )}

        {/* SCENARIO */}
        {tab==="scenario"&&(
          <div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:600,color:"#e2e8f0",marginBottom:4}}>Floor Rate Scenario Calculator</div>
              <div style={{fontSize:12,color:"#8a97ab"}}>{`Set a minimum CC% floor — see group rate and revenue impact if no physician bills below it. Based on ${LABEL(SC_KEY)} volumes (last final month).`}</div>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24,marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:24,marginBottom:20}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:"#8a97ab",marginBottom:8}}>Minimum physician CC% floor</div>
                  <input type="range" min={0} max={10} step={0.5} value={floor} onChange={e=>setFloor(parseFloat(e.target.value))}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginTop:4}}>
                    <span>0%</span><span>5%</span><span>8% (benchmark)</span><span>10%</span>
                  </div>
                </div>
                <div style={{textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:36,fontWeight:700,color:"#c8102e",fontFamily:"'DM Mono',monospace"}}>{floor}%</div>
                  <div style={{fontSize:11,color:"#8a97ab"}}>floor</div>
                </div>
              </div>
              <div className="grid4" style={{gap:12}}>
                {[
                  {label:"Current Group Rate",value:`${GROUP_RATES[SC_KEY]}%`,color:"#94a3b8"},
                  {label:"Projected Group Rate",value:`${newRate}%`,color:"#4ade80"},
                  {label:"Additional CC Bills",value:`+${totGain}`,color:"#facc15"},
                  {label:"Illustrative Revenue Gain / Mo",value:`+$${revGain.toLocaleString()}`,color:"#60a5fa"},
                ].map((c,i)=>(
                  <div key={i} style={{background:"#0f1923",borderRadius:8,padding:16,textAlign:"center"}}>
                    <div style={{fontSize:10,color:"#8a97ab",letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>{c.label}</div>
                    <div style={{fontSize:22,fontWeight:700,color:c.color,fontFamily:"'DM Mono',monospace"}}>{c.value}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:20,overflowX:"auto"}}>
              <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0",marginBottom:14}}>Per-Physician Impact</div>
              <table>
                <thead>
                  <tr style={{borderBottom:"1px solid #1a2a3a"}}>
                    {["Physician",`${LABEL(SC_KEY).split(" ")[0]} Cases`,"Actual %","Floored %","Actual CC","Projected CC","Gain"].map(h=>(
                      <th key={h} style={{textAlign:"left",padding:"8px 12px",fontSize:11,color:"#8a97ab",fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {scenarioData.map((d,i)=>(
                    <tr key={d.name} style={{borderBottom:"1px solid #0f1923",background:i%2===0?"#0a1218":"#080e14"}}>
                      <td style={{padding:"9px 12px",fontSize:13,color:"#e2e8f0",fontWeight:500}}>{d.name}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.cases}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:cellColor(d.ar),fontFamily:"'DM Mono',monospace"}}>{d.ar}%</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:cellColor(d.fr),fontFamily:"'DM Mono',monospace"}}>{d.fr.toFixed(1)}%</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.actual}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#e2e8f0",fontFamily:"'DM Mono',monospace"}}>{d.proj}</td>
                      <td style={{padding:"9px 12px",fontSize:13,fontWeight:600,color:d.gain>0?"#4ade80":"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.gain>0?`+${d.gain}`:d.gain===0?"—":d.gain}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:10,fontSize:11,color:"#64748b"}}>Illustrative only: assumes every added chart would qualify as critical care, which is not established. Revenue @ ${REV_PER_CC}/CC chart ({REV_NOTE}). For QI/leadership use only.</div>

            <div style={{marginTop:28,marginBottom:16}}>
              <div style={{fontSize:16,fontWeight:600,color:"#e2e8f0",marginBottom:4}}>Conversion Floor Scenario (mix-adjusted)</div>
              <div style={{fontSize:12,color:"#8a97ab"}}>{`Same idea on the Level 5 pool: if no physician converted fewer than X% of their high-acuity charts (CC + Level 5) to critical care. Based on ${LABEL(SC_KEY)}. Group converted ${(ccGroup("l5")[SC_KEY].conv*100).toFixed(1)}%; 8% raw needs ${(ccGroup("l5")[SC_KEY].cstar*100).toFixed(1)}%.`}</div>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24}}>
              <div style={{display:"flex",alignItems:"center",gap:24,marginBottom:20,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:220}}>
                  <div style={{fontSize:12,color:"#8a97ab",marginBottom:8}}>Minimum CC conversion of the Level 5 pool</div>
                  <input id="cfloor" type="range" min={0} max={20} step={0.5} value={cfloor} onChange={e=>setCfloor(parseFloat(e.target.value))} aria-label="conversion floor"/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#64748b",marginTop:4}}><span>0%</span><span>10%</span><span>20%</span></div>
                </div>
                <div style={{textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:36,fontWeight:700,color:"#c8102e",fontFamily:"'DM Mono',monospace"}}>{cfloor}%</div>
                  <div style={{fontSize:11,color:"#8a97ab"}}>floor</div>
                </div>
              </div>
              <div className="grid4" style={{gap:12}}>
                {[
                  {label:"Current Group Rate",value:`${GROUP_RATES[SC_KEY]}%`,color:"#94a3b8"},
                  {label:"Projected Group Rate",value:`${convNewRate}%`,color:"#4ade80"},
                  {label:"Additional CC Charts",value:`+${convGain}`,color:"#facc15"},
                  {label:"Illustrative Revenue Gain / Mo",value:`+$${(convGain*REV_PER_CC).toLocaleString()}`,color:"#60a5fa"},
                ].map((c,i)=>(
                  <div key={i} style={{background:"#0f1923",borderRadius:8,padding:16,textAlign:"center"}}>
                    <div style={{fontSize:10,color:"#8a97ab",letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>{c.label}</div>
                    <div style={{fontSize:22,fontWeight:700,color:c.color,fontFamily:"'DM Mono',monospace"}}>{c.value}</div>
                  </div>
                ))}
              </div>
              <div style={{overflowX:"auto",marginTop:16}}><table>
                <thead><tr style={{borderBottom:"1px solid #1a2a3a"}}>{["Physician","Cases","Pool","Actual CC","Conv","Projected CC","Gain"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",fontSize:11,color:"#8a97ab",fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
                <tbody>{convScen.map((d,i)=>(
                  <tr key={d.name} style={{borderBottom:"1px solid #0f1923",background:i%2===0?"#0a1218":"#080e14"}}>
                    <td style={{padding:"9px 12px",fontSize:13,color:"#e2e8f0",fontWeight:500}}>{d.name}</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:12,color:"#8a97ab"}}>{d.cases}</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:12,color:"#8a97ab"}}>{d.pool}</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:12,color:"#8a97ab"}}>{d.cc}</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:12,color:d.conv*100>=cfloor?"#4ade80":"#f87171"}}>{(d.conv*100).toFixed(1)}%</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:12,color:"#e2e8f0"}}>{d.proj}</td>
                    <td className="mono" style={{padding:"9px 12px",fontSize:13,fontWeight:600,color:d.gain>0?"#4ade80":"#8a97ab"}}>{d.gain>0?`+${d.gain}`:"—"}</td>
                  </tr>))}</tbody>
              </table></div>
              <div style={{marginTop:10,fontSize:11,color:"#64748b"}}>Illustrative only. Neither scenario establishes that any additional encounter would qualify as critical care; they size what the gap would be worth if it did.</div>
            </div>
          </div>
        )}

        {/* TABLE */}
        {tab==="table"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
              <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>All Physicians · All Months · Click month to sort</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[{id:"all",label:"All"},{id:"strong",label:"Raw ≥8%"},{id:"watch",label:"Raw 5–8%"},{id:"needs",label:"Raw <5%"}].map(f=>(
                  <button key={f.id} className="filter-btn" onClick={()=>setFilter(f.id)}
                    style={{background:filter===f.id?"#1a2a3a":"transparent",border:`1px solid ${filter===f.id?"#4a6a8a":"#2a3a4a"}`,color:filter===f.id?"#e2e8f0":"#8a97ab"}}>
                    {f.label}
                  </button>
                ))}
              </div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table>
                <thead>
                  <tr style={{borderBottom:"1px solid #1a2a3a"}}>
                    <th style={{textAlign:"left",padding:"10px 12px",color:"#8a97ab",fontWeight:500,fontSize:12,whiteSpace:"nowrap"}}>Physician</th>
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#8a97ab",fontWeight:500,fontSize:12}}>Status</th>
                    {MONTHS.map((m,i)=>(
                      <th key={m} onClick={()=>setSortBy(MONTH_KEYS[i])}
                        style={{textAlign:"center",padding:"10px 8px",color:sortBy===MONTH_KEYS[i]?"#e2e8f0":MONTH_KEYS[i]===PARTIAL_KEY?"#facc15":"#8a97ab",fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontSize:12,userSelect:"none"}}>
                        {m}{sortBy===MONTH_KEYS[i]?" ▼":""}
                      </th>
                    ))}
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#8a97ab",fontWeight:500,fontSize:12}}>3-Mo Avg</th>
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#8a97ab",fontWeight:500,fontSize:12}}>Trend</th>
                  </tr>
                </thead>
                <tbody>
                  {tableRows.map((p,idx)=>{
                    const s=getStatus(p),cfg=STATUS_CFG[s],tr=getTrend(p);
                    return(
                      <tr key={p.name} className="dr-row" style={{borderBottom:"1px solid #0f1923",background:idx%2===0?"#0a1218":"#080e14"}}>
                        <td style={{padding:"9px 12px",fontWeight:500,color:"#e2e8f0",whiteSpace:"nowrap",fontSize:13}}>
                          {p.name}{p.lowVol&&<span style={{fontSize:10,color:"#8a97ab",marginLeft:6}}>*</span>}
                        </td>
                        <td style={{padding:"9px 8px",textAlign:"center"}}>
                          <span style={{background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:4,padding:"2px 8px",fontSize:10,color:cfg.text,fontWeight:500}}>{cfg.label}</span>
                        </td>
                        {MONTH_KEYS.map((k,i)=>(
                          <td key={k} style={{padding:"9px 8px",textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:12,color:cellColor(p[k]),opacity:k===PARTIAL_KEY?0.8:1}}>
                            {p[k]!==null&&p[k]!==undefined?`${p[k]}%`:"—"}
                          </td>
                        ))}
                        <td style={{padding:"9px 8px",textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:12,color:"#94a3b8",fontWeight:600}}>{getAvg(p)!==null?`${getAvg(p)}%`:"—"}</td>
                        <td style={{padding:"9px 8px",textAlign:"center",fontSize:16,color:trendColor(tr)}}>{trendIcon(tr)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:14,display:"flex",gap:20,fontSize:11,color:"#64748b",flexWrap:"wrap"}}>
              <span style={{color:"#4ade80"}}>■ Green ≥8%</span>
              <span style={{color:"#facc15"}}>■ Yellow 5–7.9%</span>
              <span style={{color:"#f87171"}}>■ Red &lt;5%</span>
              <span style={{color:"#4ade80"}}>{codedLabel(LATEST_FINAL)} · {codedLabel(PARTIAL_KEY)} as of {DATA_ASOF}</span>
              <span>* Low volume = volatile rate</span>
              <span>Status & 3-mo avg = mean raw CC % over {LABEL(STATUS_KEYS[0]).split(" ")[0]}–{LABEL(STATUS_KEYS[2]).split(" ")[0]} (the last three near-final or final months) · provisional month excluded</span>
              <span>Completeness: provisional &lt;95% coded · near-final 95–98.9% · final ≥99%</span>
            </div>
          </div>
        )}

      </div>

      <div style={{borderTop:"1px solid #0f1923",padding:"14px 32px",fontSize:11,color:"#1e2a3a",textAlign:"center",lineHeight:1.6}}>
        CritCareIQ · Physician CC rates only · APPs excluded · Revenue figures are illustrative @ $162/CC chart (Medicare-blended increment of 99291 over 99285) · Data through Sep 2026 (provisional, as of 10/13/26) · Provisional &lt;95% coded · near-final 95–98.9% · final ≥99% · For QI/educational use only · Not a substitute for compliance review · Mercy Fitzgerald O52
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
