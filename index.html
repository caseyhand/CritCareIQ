<script>
(function() {
  var PW = "MTF2026";
  var input = document.getElementById("pw-input");
  var btn   = document.getElementById("pw-btn");
  var err   = document.getElementById("pw-err");
  var gate  = document.getElementById("gate");
  var root  = document.getElementById("root");
  function attempt() {
    if (input.value.trim() === PW) {
      gate.style.display = "none";
      root.style.display = "block";
    } else {
      err.style.display = "block";
      input.value = "";
      input.style.borderColor = "#c8102e";
      setTimeout(function(){ err.style.display="none"; input.style.borderColor="#2a3a4a"; }, 2000);
    }
  }
  btn.addEventListener("click", attempt);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") attempt(); });
  input.focus();
})();
</script>

/* ── SVG Line Chart (no external deps) ── */
function SvgChart({ data, lines, yMax=14, height=240 }) {
  const [tip, setTip] = useState(null);
  const PL=44, PR=24, PT=12, PB=38;
  const VW=900, VH=height;
  const cW=VW-PL-PR, cH=VH-PT-PB;
  const xS = i => PL + (data.length<2?cW/2:i/(data.length-1)*cW);
  const yS = v => PT + cH - Math.min(Math.max(v/yMax,0),1)*cH;
  const yTicks = [];
  for(let v=0;v<=yMax;v+=2) yTicks.push(v);

  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:"100%",display:"block"}} onMouseLeave={()=>setTip(null)}>
        {yTicks.map(v=>(
          <g key={v}>
            <line x1={PL} x2={VW-PR} y1={yS(v)} y2={yS(v)} stroke="#1a2a3a" strokeWidth={1}/>
            <text x={PL-6} y={yS(v)+4} textAnchor="end" fill="#475569" fontSize={10}>{v}%</text>
          </g>
        ))}
        <line x1={PL} x2={VW-PR} y1={yS(BENCHMARK)} y2={yS(BENCHMARK)} stroke="#facc15" strokeWidth={1.5} strokeDasharray="6 4"/>
        <text x={VW-PR+4} y={yS(BENCHMARK)+4} fill="#facc15" fontSize={9}>8%</text>
        {data.map((d,i)=>(
          <text key={i} x={xS(i)} y={VH-4} textAnchor="middle" fill={d.partial?"#facc15":"#475569"} fontSize={9}>{d.month}</text>
        ))}
        {lines.map((ln,li)=>{
          const pts=data.map((d,i)=>({x:xS(i),y:yS(d[ln.key]??-999),v:d[ln.key],m:d.month,ok:d[ln.key]!==null&&d[ln.key]!==undefined}));
          const segs=[]; let seg=[];
          pts.forEach(p=>{if(p.ok){seg.push(p);}else{if(seg.length){segs.push(seg);seg=[];}}});
          if(seg.length)segs.push(seg);
          return (
            <g key={li}>
              {segs.map((s,si)=>(
                <polyline key={si} points={s.map(p=>`${p.x},${p.y}`).join(" ")} fill="none" stroke={ln.color} strokeWidth={ln.bold?3:1.5} opacity={0.9}/>
              ))}
              {pts.filter(p=>p.ok).map((p,pi)=>(
                <circle key={pi} cx={p.x} cy={p.y} r={5} fill={ln.color} style={{cursor:"crosshair"}}
                  onMouseEnter={()=>setTip({x:p.x,y:p.y,month:p.m,label:ln.label,val:p.v})}/>
              ))}
            </g>
          );
        })}
      </svg>
      {tip&&(
        <div style={{position:"absolute",top:Math.max(tip.y-50,0),left:Math.min((tip.x/900*100)+2,65)+"%",
          background:"#0f1923",border:"1px solid #2a3a4a",borderRadius:8,padding:"8px 12px",
          fontSize:12,color:"#e2e8f0",pointerEvents:"none",whiteSpace:"nowrap",zIndex:20}}>
          <div style={{color:"#475569",marginBottom:2}}>{tip.month}</div>
          <div style={{fontFamily:"'DM Mono',monospace",fontWeight:600}}>{tip.label}: {tip.val}%</div>
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════
   CCAR — Critical Care Above Replacement (mix-adjusted metrics)
   pool  = sick patients you saw: Level 5 + CC charts (billing)  OR  ESI 1–2 patients (triage; nurse-assigned)
   conv  = CC ÷ pool                           (CC conversion; CC+ = conv ÷ group conv × 100)
   xCC   = pool × baseline conversion          (expected CC)
   CCAR  = CC − xCC                            (counting stat; baseline = pre-series 4.5% | group avg (CCAA) | 8% target)
   See: CC Conversion Metric — Methods Note.
   ══════════════════════════════════════════════════════════════ */
const ESI_BY_NAME = {}; ESI_COUNTS.forEach(e => { ESI_BY_NAME[e.name] = e; });
const CC_LABEL = k => LABEL(k).split(" ")[0];
const POOL_MONTHS = pool => pool==="esi" ? ESI_COMPLETE : CC_MONTH_KEYS;
// per physician-month: cc (billing), pool (by mode), cases (billing), l5, esi (if present)
function ccPoint(p, m, pool){
  const v = p[m]; if(!v) return null;
  const e = ESI_BY_NAME[p.name] && ESI_BY_NAME[p.name][m];
  if (pool==="esi" && !e) return null;
  return { cases:v[0], cc:v[1], l5:v[2], pool: pool==="esi" ? e[1]+e[2] : v[1]+v[2], esi:e||null };
}
const CC_GROUP_BY = {};
function ccGroup(pool){
  if (CC_GROUP_BY[pool]) return CC_GROUP_BY[pool];
  const g = {};
  POOL_MONTHS(pool).forEach(m => {
    let N=0, CC=0, P=0;
    CC_COUNTS.forEach(p => { const x=ccPoint(p,m,pool); if(x){ N+=x.cases; CC+=x.cc; P+=x.pool; } });
    g[m] = { N, CC, P, conv: CC/P, raw: CC/N, cstar: (BENCHMARK/100)*N/P, crepl: REPL_RAW*N/P };
  });
  return (CC_GROUP_BY[pool] = g);
}
function ccWindows(pool){
  const ms = POOL_MONTHS(pool); const w = {}; const n = ms.length;
  for (let i=n; i>=3; i--) { const s = ms.slice(i-3, i); w[`${CC_LABEL(s[0])}–${CC_LABEL(s[2])}`] = s; }
  w["Season"] = ms.slice();
  return w;
}
const ccBase = (g, m, base) => base==="target" ? g[m].cstar : base==="repl" ? g[m].crepl : g[m].conv;
const CC_BASE_LABEL = { group:"CCAA", target:"vs 8% target", repl:"CCAR" };
function ccAgg(p, ms, base, pool){
  const g = ccGroup(pool);
  let cases=0, cc=0, l5=0, P=0, d=0, k=0, e45=0, epts=0, hrs=0;
  ms.forEach(m => { const x=ccPoint(p,m,pool); if(!x) return; cases+=x.cases; cc+=x.cc; l5+=x.l5; P+=x.pool; k++; d += x.cc - x.pool*ccBase(g,m,base);
    if (x.esi){ e45 += x.esi[4]+x.esi[5]; epts += x.esi[0]; hrs += x.esi[6]; } });
  return { cases, cc, l5, pool:P, k, raw: cases?cc/cases:null, conv:P?cc/P:null, l5s: cases?l5/cases:null, e45s: epts?e45/epts:null, hrs, d };
}
const CC_NIGHTS = ["Bianchi, Pollianne","Urban, Colleen"];   // nocturnists: compare to each other and to own trend
function ccReason(p, cur, base, pool, firstWin, gconv){
  const tags = [];
  if (CC_NIGHTS.includes(p.name)) tags.push({t:"Nights", c:"info"});
  const pit = cur.e45s!==null ? cur.e45s >= 0.20 : (cur.l5s!==null && cur.l5s < 0.45);
  if (pit) tags.push({t: cur.e45s!==null ? `PIT-heavy · ${Math.round(cur.e45s*100)}% ESI 4–5` : "PIT signature · check schedule", c:"warn"});
  const first = ccAgg(p, firstWin, base, pool);
  if (first.k===3 && cur.k===3 && cur.d - first.d >= 8) tags.push({t:`Improved +${(cur.d-first.d).toFixed(0)} vs ${CC_LABEL(firstWin[0])}–${CC_LABEL(firstWin[2])}`, c:"good"});
  const ms = POOL_MONTHS(pool);
  const early = ms.slice(0,3).map(m=>ccPoint(p,m,pool)).filter(Boolean);
  if (early.length>=2){ const ec=early.reduce((s,x)=>s+x.cc,0)/early.reduce((s,x)=>s+x.pool,0); if (cur.conv!==null && (ec-cur.conv)/gconv >= 0.4) tags.push({t:"Declining vs spring", c:"bad"}); }
  const sick = cur.e45s!==null ? cur.e45s <= 0.10 : (cur.l5s!==null && cur.l5s >= 0.6);
  if (sick && cur.conv!==null && cur.conv < gconv*0.75) tags.push({t:"Sick mix, low conversion", c:"bad"});
  return tags;
}
const CC_PILL = { good:["#0a1f0a","#1a5a32","#4ade80"], warn:["#1a1a08","#4a4a10","#facc15"], bad:["#1f0a0a","#5a1a1a","#f87171"], info:["#08101a","#10203a","#60a5fa"] };
const CcPill = ({c,children}) => { const [bg,bd,fg]=CC_PILL[c]; return <span className="pill" style={{background:bg,borderColor:bd,color:fg}}>{children}</span>; };
const ccPct = (x,d=1) => x===null||x===undefined ? "—" : (x*100).toFixed(d)+"%";
const ccSigned = x => (x>0?"+":"")+x.toFixed(1);

function CcDivBar({ v, max }){

function CcSpark({ p, base, pool }){
  const g = ccGroup(pool); const ms = POOL_MONTHS(pool);
  const W=420, H=120, PL=34, PR=12, PT=10, PB=22;
  const pts = ms.map((m,i)=>{ const x=ccPoint(p,m,pool); return {m, i, c: x&&x.pool?x.cc/x.pool:null, g: ccBase(g,m,base)}; });
  const yMax = Math.max(pool==="esi"?0.45:0.22, ...pts.map(d=>d.c||0), ...pts.map(d=>d.g))*1.05;
  const xS = i => PL + (ms.length<2?0:i/(ms.length-1))*(W-PL-PR);
  const yS = v => PT + (H-PT-PB) - (v/yMax)*(H-PT-PB);
  const segs=[]; let seg=[]; pts.forEach(d=>{ if(d.c!==null) seg.push(d); else { if(seg.length) segs.push(seg); seg=[]; } }); if(seg.length) segs.push(seg);
  const ticks = pool==="esi" ? [0,0.2,0.4] : [0,0.1,0.2];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:460,display:"block"}}>
      {ticks.map(t=> t<=yMax && <g key={t}><line x1={PL} x2={W-PR} y1={yS(t)} y2={yS(t)} stroke="#1a2a3a"/><text x={PL-5} y={yS(t)+3} textAnchor="end" fill="#475569" fontSize="9">{Math.round(t*100)}%</text></g>)}
      <polyline points={pts.map(d=>`${xS(d.i)},${yS(d.g)}`).join(" ")} fill="none" stroke="#facc15" strokeWidth="1.5" strokeDasharray="5 4"/>
      {segs.map((s,i)=><polyline key={i} points={s.map(d=>`${xS(d.i)},${yS(d.c)}`).join(" ")} fill="none" stroke="#c8102e" strokeWidth="2"/>)}
      {pts.filter(d=>d.c!==null).map(d=><circle key={d.i} cx={xS(d.i)} cy={yS(d.c)} r="4" fill="#c8102e" stroke="#080e14" strokeWidth="2"/>)}
      {pts.map(d=><text key={d.i} x={xS(d.i)} y={H-6} textAnchor="middle" fill={d.m===PARTIAL_KEY?"#facc15":"#475569"} fontSize="9">{CC_LABEL(d.m)}</text>)}
    </svg>
  );
}
function CcDetail({ p, win, base, pool, windows }){
  const ms = windows[win]; const g = ccGroup(pool); const allMs = CC_MONTH_KEYS;
  const e = ESI_BY_NAME[p.name] || {};
  return (

          <span><span style={{color:"#facc15"}}>◉</span> {base==="target"?"8% target, in conversion terms":base==="repl"?"Pre-series (4.5%) documentation, in conversion terms":"Group conversion that month"}</span>
        </div>
      </div>

        <div style={{fontSize:11,color:"#475569",letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>Month by month</div>
        <div style={{overflowX:"auto"}}><table style={{fontSize:12}}>
          <thead><tr style={{color:"#475569",fontSize:10,letterSpacing:".5px"}}>
            {["","Cases","L5 %","ESI 1–2","ESI 4–5 %","Hrs","CC","Conv","Δ"].map((h,i)=><th key={i} style={{textAlign:h===""?"left":"right",padding:"2px 6px",fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>)}
          </tr></thead>

            const x = ccPoint(p,m,pool); const inWin=ms.includes(m); const usable = !!x && POOL_MONTHS(pool).includes(m);
            const cv = x&&x.pool ? x.cc/x.pool : null; const d = usable ? x.cc - x.pool*ccBase(g,m,base) : null;
            const td = (val,extra)=><td style={Object.assign({textAlign:"right",padding:"3px 6px",fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap"},extra||{})}>{val}</td>;
            return <tr key={m} style={{color:inWin?"#e2e8f0":"#64748b",background:inWin?"#0f1923":"transparent"}}>
              <td style={{padding:"3px 6px",whiteSpace:"nowrap"}}>{CC_LABEL(m)}{ESI_PARTIAL[m]&&<span style={{color:"#facc15",fontSize:9,marginLeft:4}}>ESI {ESI_PARTIAL[m]}</span>}</td>

      <div style={{background:"linear-gradient(180deg,#0d1a26,#080e14)",borderBottom:"1px solid #1a2a3a",padding:"18px 32px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:40,height:40,background:"linear-gradient(135deg,#c8102e,#7b0019)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,boxShadow:"0 0 20px rgba(200,16,46,.3)"}}>⚕</div>
          <div>
            <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-0.3px"}}>CritCareIQ</div>
            <div style={{fontSize:11,color:"#475569",letterSpacing:"0.5px"}}>MERCY FITZGERALD · O52 · PHYSICIAN CC RATES ONLY</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10}}>
          <span style={{background:"#0d1f0d",border:"1px solid #1a4a1a",borderRadius:6,padding:"5px 12px",fontSize:11,color:"#4ade80",letterSpacing:"1px"}}>NOV 2025 – SEP 2026</span>
          <span style={{background:"#1a0d0d",border:"1px solid #4a1a1a",borderRadius:6,padding:"5px 12px",fontSize:11,color:"#f87171",letterSpacing:"1px"}}>TARGET: 8–10%</span>
        </div>
      </div>

      {/* Nav */}
      <div style={{display:"flex",borderBottom:"1px solid #1a2a3a",background:"#0a1520",padding:"0 32px",overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} className="tab-btn" onClick={()=>setTab(t.id)}
            style={{padding:"13px 18px",fontSize:13,fontWeight:500,whiteSpace:"nowrap",
              color:tab===t.id?"#e2e8f0":"#475569",
              borderBottom:tab===t.id?"2px solid #c8102e":"2px solid transparent",marginBottom:-1}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"28px 32px",maxWidth:1300,margin:"0 auto",width:"100%",flex:1}}>

        {/* OVERVIEW */}
        {tab==="overview"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:24}}>
              {[
                {label:`${LABEL(PARTIAL_KEY)} Physician CC Rate`,value:`${latestRate}%*`,sub:`${CODED[PARTIAL_KEY]} coded · ${LABEL(LATEST_FINAL)} final ${finalRate}% · peak ${peak[1]}% ${LABEL(peak[0])}`,color:latestRate>=BENCHMARK?"#4ade80":latestRate>=5?"#facc15":"#f87171",bg:"#1a1a08",border:"#3a3a10"},
                {label:"National EM Benchmark",value:"8–10%",sub:`Gap: ${(BENCHMARK-latestRate).toFixed(1)}pts · ~${gapCharts} more CC charts/mo to reach 8%`,color:"#facc15",bg:"#1a1a08",border:"#3a3a10"},
                {label:"Est. Missed Rev / Month",value:`~$${(missedMo/1000).toFixed(1)}K`,sub:`vs. 8% benchmark on ${latestCases.toLocaleString()} ${LABEL(PARTIAL_KEY)} visits`,color:"#f87171",bg:"#1a0808",border:"#3a1010"},
                {label:"Annualized Opportunity",value:`~$${Math.round(missedMo*12/1000)}K`,sub:`@ $${REV_PER_CC}/encounter (Medicare blended)`,color:"#60a5fa",bg:"#08101a",border:"#10203a"},
              ].map((c,i)=>(
                <div key={i} style={{background:c.bg,border:`1px solid ${c.border}`,borderRadius:12,padding:20}}>
                  <div style={{fontSize:11,color:"#475569",letterSpacing:"1px",textTransform:"uppercase",marginBottom:8}}>{c.label}</div>
                  <div style={{fontSize:28,fontWeight:700,color:c.color,letterSpacing:"-1px",marginBottom:4}}>{c.value}</div>
                  <div style={{fontSize:12,color:"#64748b"}}>{c.sub}</div>
                </div>
              ))}
            </div>

            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24,marginBottom:24}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
                <div>
                  <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>Physician CC Rate — Group Trend</div>
                  <div style={{fontSize:12,color:"#475569",marginTop:2}}>Volume Group – Physicians row only · APPs excluded</div>
                </div>
                <span style={{background:"#0d1a0d",border:"1px solid #1a3a1a",borderRadius:6,padding:"4px 12px",fontSize:11,color:"#4ade80",whiteSpace:"nowrap"}}>★ Email series launched late Mar '26</span>
              </div>
              <SvgChart data={groupData} lines={[{key:"rate",label:"Physician CC%",color:"#c8102e",bold:true}]} yMax={12} height={220}/>
              <div style={{display:"flex",gap:20,marginTop:8,fontSize:11,color:"#475569",flexWrap:"wrap"}}>
                <span>● Red = physician CC rate</span>
                <span style={{color:"#facc15"}}>◉ Yellow = 8% benchmark line</span>
                <span style={{color:"#4ade80"}}>{LABEL(LATEST_FINAL)} final · {LABEL(PARTIAL_KEY)} {CODED[PARTIAL_KEY]} coded as of {DATA_ASOF}</span>
              </div>
            </div>

            {/* RCM coding feedback callout */}
            <div style={{background:"#0a1520",border:"1px solid #3a1010",borderLeft:"3px solid #c8102e",borderRadius:12,padding:"18px 24px",marginBottom:24,display:"grid",gridTemplateColumns:"auto 1fr",gap:24,alignItems:"center"}}>
              <div style={{textAlign:"center",minWidth:110}}>
                <div style={{fontSize:34,fontWeight:700,color:"#f87171",fontFamily:"'DM Mono',monospace",lineHeight:1}}>{AUG_DOWNCODES}</div>
                <div style={{fontSize:10,color:"#475569",letterSpacing:"1px",textTransform:"uppercase",marginTop:6}}>{LABEL(DOWNCODE_KEY).split(" ")[0]} CC statements<br/>downcoded to 99285</div>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0",marginBottom:6}}>RCM coding feedback — {LABEL(DOWNCODE_KEY)}: the note didn't support the time statement</div>
                <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6}}>
                  Had all {AUG_DOWNCODES} held up, {LABEL(DOWNCODE_KEY)} would be <span style={{color:"#facc15",fontFamily:"'DM Mono',monospace"}}>{ifSupported}%</span> — flat with prior months instead of a dip.
                  Three patterns: <span style={{color:"#e2e8f0"}}>intervention written as a plan, not as done</span> ("Plan: IVF" — no dose, route, or response) ·
                  <span style={{color:"#e2e8f0"}}> critical illness in the CC statement but not in the final diagnosis</span> ("shock" vs. "hypotension") ·
                  <span style={{color:"#e2e8f0"}}> observation-only visits with a CC statement</span> (intoxication, OD protecting airway) — these weren't critical care.
                </div>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
              {["strong","watch","needs"].map(s=>{
                const cfg=STATUS_CFG[s];
                const docs=PHYSICIANS.filter(p=>getStatus(p)===s&&!p.lowVol);
                return(
                  <div key={s} style={{background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:12,padding:20}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                      <div style={{fontSize:13,fontWeight:600,color:cfg.text}}>{cfg.label}</div>
                      <span style={{background:cfg.border,borderRadius:20,padding:"2px 10px",fontSize:12,color:cfg.text,fontWeight:600}}>{docs.length}</span>
                    </div>
                    {docs.map(p=>{
                      const tr=getTrend(p);
                      return(
                        <div key={p.name} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#94a3b8",marginBottom:6,paddingBottom:6,borderBottom:"1px solid rgba(255,255,255,.04)"}}>
                          <span>{p.name.split(",")[0]}</span>
                          <span style={{color:cfg.text,fontWeight:500,fontFamily:"'DM Mono',monospace"}}>
                            {p[LATEST_FINAL]!==null&&p[LATEST_FINAL]!==undefined?`${p[LATEST_FINAL]}% ${LABEL(LATEST_FINAL).split(" ")[0]}`:"—"}
                            <span style={{marginLeft:6,color:trendColor(tr)}}>{trendIcon(tr)}</span>
                          </span>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* LEADERBOARD */}
        {tab==="leaderboard"&&(
          <div>
            <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontSize:16,fontWeight:600,color:"#e2e8f0",marginBottom:4}}>{LABEL(lbMonth)} Physician Leaderboard{lbMonth===PARTIAL_KEY?" (partial)":""}</div>
                <div style={{fontSize:12,color:"#475569"}}>Ranked by CC% · ≥20 cases · Benchmark: 8–10% · Low-volume excluded{CODED[lbMonth]?` · ${CODED[lbMonth]} of charts coded`:""}</div>
              </div>
              <select value={lbMonth} onChange={e=>setLbMonth(e.target.value)}>
                {MONTH_KEYS.slice().reverse().map(k=><option key={k} value={k}>{MONTHS[MONTH_KEYS.indexOf(k)]}</option>)}
              </select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {leaderboard.map((p,i)=>{
                const pct=p[lbMonth];
                const barW=Math.min((pct/14)*100,100);
                const bc=pct>=BENCHMARK?"#4ade80":pct>=5?"#facc15":"#f87171";
                return(
                  <div key={p.name} style={{background:"#0a1520",border:`1px solid ${pct>=BENCHMARK?"#1a4a1a":"#1a2a3a"}`,borderRadius:10,padding:"16px 20px",display:"flex",alignItems:"center",gap:16}}>
                    <div style={{width:32,height:32,borderRadius:"50%",flexShrink:0,
                      background:i===0?"linear-gradient(135deg,#f59e0b,#d97706)":i===1?"linear-gradient(135deg,#94a3b8,#64748b)":i===2?"linear-gradient(135deg,#b45309,#92400e)":"#1a2a3a",
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:i<3?"#fff":"#475569"}}>
                      {i+1}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>{p.name}</div>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <span style={{fontSize:11,color:"#475569"}}>{p.cases[lbMonth]} cases</span>
                          <span style={{fontSize:20,fontWeight:700,color:bc,fontFamily:"'DM Mono',monospace"}}>{pct}%</span>
                        </div>
                      </div>
                      <div style={{background:"#131e2a",borderRadius:4,height:8,overflow:"hidden"}}>
                        <div style={{width:`${barW}%`,height:"100%",background:`linear-gradient(90deg,${bc}88,${bc})`,borderRadius:4}}/>
                      </div>
                      <div style={{display:"flex",justifyContent:"flex-end",marginTop:4,fontSize:10,color:pct>=BENCHMARK?"#4ade80":"#475569"}}>
                        {pct>=BENCHMARK?"✓ At benchmark":`${(BENCHMARK-pct).toFixed(1)}% below target`}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CCAR */}
        {tab==="ccar"&&<CcarTab/>}

        {/* STAT GUIDE */}
        {tab==="guide"&&<StatGuide/>}

        {/* TRENDS */}
        {tab==="trends"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>Individual Physician Trends</div>
                <div style={{fontSize:12,color:"#475569",marginTop:2}}>Default: ≥30 {LABEL(LATEST_FINAL)} cases · Yellow dashed = 8% target</div>
              </div>
              <select value={selDr} onChange={e=>setSelDr(e.target.value)}>
                <option value="">All (≥30 cases)</option>
                {PHYSICIANS.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
              </select>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24}}>
              <SvgChart
                data={trendData}
                lines={chartDrs.map((p,i)=>({key:p.name,label:p.name.split(",")[0],color:LINE_COLORS[i%LINE_COLORS.length],bold:selDr===p.name}))}
                yMax={24} height={380}
              />
            </div>
            {!selDr&&(
              <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:"8px 16px"}}>
                {chartDrs.map((p,i)=>(
                  <span key={p.name} onClick={()=>setSelDr(p.name)}
                    style={{fontSize:11,color:LINE_COLORS[i%LINE_COLORS.length],cursor:"pointer"}}>
                    ● {p.name.split(",")[0]}
                  </span>
                ))}
              </div>
            )}
            {selDr&&<button onClick={()=>setSelDr("")} style={{marginTop:12,background:"transparent",border:"1px solid #2a3a4a",borderRadius:6,padding:"6px 14px",color:"#475569",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>← Show all</button>}
            <div style={{marginTop:10,fontSize:11,color:"#334155"}}>{LABEL(LATEST_FINAL)} final · {LABEL(PARTIAL_KEY)} {CODED[PARTIAL_KEY]} coded as of {DATA_ASOF} — may rise slightly as late charts bill.</div>
          </div>
        )}

        {/* SCENARIO */}
        {tab==="scenario"&&(
          <div>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:600,color:"#e2e8f0",marginBottom:4}}>Floor Rate Scenario Calculator</div>
              <div style={{fontSize:12,color:"#475569"}}>{`Set a minimum CC% floor — see group rate and revenue impact if no physician bills below it. Based on ${LABEL(SC_KEY)} volumes (last final month).`}</div>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:24,marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",gap:24,marginBottom:20}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:"#475569",marginBottom:8}}>Minimum physician CC% floor</div>
                  <input type="range" min={0} max={10} step={0.5} value={floor} onChange={e=>setFloor(parseFloat(e.target.value))}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#334155",marginTop:4}}>
                    <span>0%</span><span>5%</span><span>8% (benchmark)</span><span>10%</span>
                  </div>
                </div>
                <div style={{textAlign:"center",minWidth:80}}>
                  <div style={{fontSize:36,fontWeight:700,color:"#c8102e",fontFamily:"'DM Mono',monospace"}}>{floor}%</div>
                  <div style={{fontSize:11,color:"#475569"}}>floor</div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
                {[
                  {label:"Current Group Rate",value:`${GROUP_RATES[SC_KEY]}%`,color:"#94a3b8"},
                  {label:"Projected Group Rate",value:`${newRate}%`,color:"#4ade80"},
                  {label:"Additional CC Bills",value:`+${totGain}`,color:"#facc15"},
                  {label:"Monthly Revenue Gain",value:`+$${revGain.toLocaleString()}`,color:"#60a5fa"},
                ].map((c,i)=>(
                  <div key={i} style={{background:"#0f1923",borderRadius:8,padding:16,textAlign:"center"}}>
                    <div style={{fontSize:10,color:"#475569",letterSpacing:"1px",textTransform:"uppercase",marginBottom:6}}>{c.label}</div>
                    <div style={{fontSize:22,fontWeight:700,color:c.color,fontFamily:"'DM Mono',monospace"}}>{c.value}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:20,overflowX:"auto"}}>
              <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0",marginBottom:14}}>Per-Physician Impact</div>
              <table>
                <thead>
                  <tr style={{borderBottom:"1px solid #1a2a3a"}}>
                    {["Physician",`${LABEL(SC_KEY).split(" ")[0]} Cases`,"Actual %","Floored %","Actual CC","Projected CC","Gain"].map(h=>(
                      <th key={h} style={{textAlign:"left",padding:"8px 12px",fontSize:11,color:"#475569",fontWeight:500,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {scenarioData.map((d,i)=>(
                    <tr key={d.name} style={{borderBottom:"1px solid #0f1923",background:i%2===0?"#0a1218":"#080e14"}}>
                      <td style={{padding:"9px 12px",fontSize:13,color:"#e2e8f0",fontWeight:500}}>{d.name}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.cases}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:cellColor(d.ar),fontFamily:"'DM Mono',monospace"}}>{d.ar}%</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:cellColor(d.fr),fontFamily:"'DM Mono',monospace"}}>{d.fr.toFixed(1)}%</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.actual}</td>
                      <td style={{padding:"9px 12px",fontSize:12,color:"#e2e8f0",fontFamily:"'DM Mono',monospace"}}>{d.proj}</td>
                      <td style={{padding:"9px 12px",fontSize:13,fontWeight:600,color:d.gain>0?"#4ade80":"#64748b",fontFamily:"'DM Mono',monospace"}}>{d.gain>0?`+${d.gain}`:d.gain===0?"—":d.gain}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:10,fontSize:11,color:"#334155"}}>Revenue @ ${REV_PER_CC}/encounter (Medicare blended). For QI/leadership use only.</div>
          </div>
        )}

        {/* TABLE */}
        {tab==="table"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
              <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>All Physicians · All Months · Click month to sort</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[{id:"all",label:"All"},{id:"strong",label:"Strong"},{id:"watch",label:"Developing"},{id:"needs",label:"Needs Attn"}].map(f=>(
                  <button key={f.id} className="filter-btn" onClick={()=>setFilter(f.id)}
                    style={{background:filter===f.id?"#1a2a3a":"transparent",border:`1px solid ${filter===f.id?"#4a6a8a":"#2a3a4a"}`,color:filter===f.id?"#e2e8f0":"#475569"}}>
                    {f.label}
                  </button>
                ))}
              </div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table>
                <thead>
                  <tr style={{borderBottom:"1px solid #1a2a3a"}}>
                    <th style={{textAlign:"left",padding:"10px 12px",color:"#475569",fontWeight:500,fontSize:12,whiteSpace:"nowrap"}}>Physician</th>
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#475569",fontWeight:500,fontSize:12}}>Status</th>
                    {MONTHS.map((m,i)=>(
                      <th key={m} onClick={()=>setSortBy(MONTH_KEYS[i])}
                        style={{textAlign:"center",padding:"10px 8px",color:sortBy===MONTH_KEYS[i]?"#e2e8f0":MONTH_KEYS[i]===PARTIAL_KEY?"#facc15":"#475569",fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontSize:12,userSelect:"none"}}>
                        {m}{sortBy===MONTH_KEYS[i]?" ▼":""}
                      </th>
                    ))}
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#475569",fontWeight:500,fontSize:12}}>3-Mo Avg</th>
                    <th style={{textAlign:"center",padding:"10px 8px",color:"#475569",fontWeight:500,fontSize:12}}>Trend</th>
                  </tr>
                </thead>
                <tbody>
                  {tableRows.map((p,idx)=>{
                    const s=getStatus(p),cfg=STATUS_CFG[s],tr=getTrend(p);
                    return(
                      <tr key={p.name} className="dr-row" style={{borderBottom:"1px solid #0f1923",background:idx%2===0?"#0a1218":"#080e14"}}>
                        <td style={{padding:"9px 12px",fontWeight:500,color:"#e2e8f0",whiteSpace:"nowrap",fontSize:13}}>
                          {p.name}{p.lowVol&&<span style={{fontSize:10,color:"#475569",marginLeft:6}}>*</span>}
                        </td>
                        <td style={{padding:"9px 8px",textAlign:"center"}}>
                          <span style={{background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:4,padding:"2px 8px",fontSize:10,color:cfg.text,fontWeight:500}}>{cfg.label}</span>
                        </td>
                        {MONTH_KEYS.map((k,i)=>(
                          <td key={k} style={{padding:"9px 8px",textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:12,color:cellColor(p[k]),opacity:k===PARTIAL_KEY?0.8:1}}>
                            {p[k]!==null&&p[k]!==undefined?`${p[k]}%`:"—"}
                          </td>
                        ))}
                        <td style={{padding:"9px 8px",textAlign:"center",fontFamily:"'DM Mono',monospace",fontSize:12,color:"#94a3b8",fontWeight:600}}>{getAvg(p)!==null?`${getAvg(p)}%`:"—"}</td>
                        <td style={{padding:"9px 8px",textAlign:"center",fontSize:16,color:trendColor(tr)}}>{trendIcon(tr)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:14,display:"flex",gap:20,fontSize:11,color:"#334155",flexWrap:"wrap"}}>
              <span style={{color:"#4ade80"}}>■ Green ≥8%</span>
              <span style={{color:"#facc15"}}>■ Yellow 5–7.9%</span>
              <span style={{color:"#f87171"}}>■ Red &lt;5%</span>
              <span style={{color:"#4ade80"}}>{LABEL(LATEST_FINAL)} final · {LABEL(PARTIAL_KEY)} {CODED[PARTIAL_KEY]} coded as of {DATA_ASOF}</span>
              <span>* Low volume = volatile rate</span>
              <span>Status & avg = last 3 final months ({LABEL(STATUS_KEYS[0]).split(" ")[0]}–{LABEL(STATUS_KEYS[2]).split(" ")[0]}) · partial months excluded</span>
            </div>
          </div>
        )}

      </div>

      <div style={{borderTop:"1px solid #0f1923",padding:"14px 32px",fontSize:11,color:"#1e2a3a",textAlign:"center",lineHeight:1.6}}>
        CritCareIQ · Physician CC rates only · APPs excluded · Revenue est. @ $162/encounter (Medicare blended) · Data through Sep 2026 (as of 10/13/26) · For QI/educational use only · Not a substitute for compliance review · Mercy Fitzgerald O52
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
