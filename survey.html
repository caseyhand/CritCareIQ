<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CritCareIQ — Physician Survey</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background: #080e14; color: #e2e8f0; font-family: 'DM Sans', 'Helvetica Neue', sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0f1923; }
  ::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 3px; }
  .opt-btn { width: 100%; text-align: left; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .opt-btn:hover { border-color: #4a9eff !important; }
  .scale-btn { cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .scale-btn:hover { border-color: #4a9eff !important; color: #4a9eff !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const AIRTABLE_TOKEN = "patD5HRLtQKtzygC3.7166690a98476817f8ec32c13df831cdf56d6e94c0af5745dfa72c70106f7d55";
const AIRTABLE_BASE  = "appUso9CpKU0wexuK";
const AIRTABLE_TABLE = "Responses";
const ADMIN_PASSWORD = "critcare2026";

async function saveToAirtable(name, answers) {
  const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(AIRTABLE_TABLE)}`;
  const fields = {
    "Name":                name,
    "Time Stamp":          new Date().toISOString(),
    "Q1 Confidence":       answers.q1 ?? null,
    "Q2 CC Requirements":  Array.isArray(answers.q2) ? answers.q2.join(", ") : (answers.q2 || ""),
    "Q3 Cases Billed":     Array.isArray(answers.q3) ? answers.q3.join(", ") : (answers.q3 || ""),
    "Q4 Main Barrier":     answers.q4 || "",
    "Q5 EPIC Familiarity": answers.q5 ?? null,
    "Q6 What Would Help":  Array.isArray(answers.q6) ? answers.q6.join(", ") : (answers.q6 || ""),
    "Q7 Open Comments":    answers.q7 || "",
  };
  Object.keys(fields).forEach(k => { if (fields[k] === null || fields[k] === "") delete fields[k]; });
  const res = await fetch(url, {
    method: "POST",
    headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}`, "Content-Type": "application/json" },
    body: JSON.stringify({ fields }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e?.error?.message || `Error ${res.status}`); }
  return res.json();
}

async function fetchFromAirtable() {
  const url = `https://api.airtable.com/v0/${AIRTABLE_BASE}/${encodeURIComponent(AIRTABLE_TABLE)}?sort[0][field]=Time%20Stamp&sort[0][direction]=desc`;
  const res = await fetch(url, { headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}` } });
  if (!res.ok) throw new Error(`Fetch error ${res.status}`);
  const data = await res.json();
  return (data.records || []).map(r => ({
    id: r.id,
    name: r.fields["Name"] || "—",
    timestamp: r.fields["Time Stamp"] || "",
    q1: r.fields["Q1 Confidence"],
    q2: r.fields["Q2 CC Requirements"] || "",
    q3: r.fields["Q3 Cases Billed"] || "",
    q4: r.fields["Q4 Main Barrier"] || "",
    q5: r.fields["Q5 EPIC Familiarity"],
    q6: r.fields["Q6 What Would Help"] || "",
    q7: r.fields["Q7 Open Comments"] || "",
  }));
}

const QUESTIONS = [
  { id:"q1", text:"How confident are you in identifying when a patient qualifies for critical care billing?", type:"scale", labels:["Not confident","Very confident"] },
  { id:"q2", text:"Which of the following do you believe are required to bill critical care? (select all that apply)", type:"multi", options:["ICU admission","Intubation or invasive procedure","Physician actively managing a life-threatening condition","At least 30 minutes of direct care time","A specific diagnosis (e.g. sepsis, STEMI)","Documentation of time in the note"] },
  { id:"q3", text:"Which of these presentations do you typically bill as critical care? (select all that apply)", type:"multi", options:["Septic shock with vasopressors","Sepsis without shock but with lactate >2 and active resuscitation","Acute respiratory failure on BiPAP / HFNC","Severe hyperkalemia with EKG changes","Undifferentiated shock with bedside echo","Acute encephalopathy with dangerous differential","GI bleed requiring transfusion","None of the above — I rarely bill CC"] },
  { id:"q4", text:"What is the most common reason you don't bill critical care on a case that might qualify?", type:"single", options:["Not sure if the case actually qualifies","The patient improved quickly","I didn't have 30 minutes of documented time","I forgot to add the CC statement","Concerned about audit risk","I bill CC routinely when it applies"] },
  { id:"q5", text:"How familiar are you with the EPIC critical care procedure note and how to use it?", type:"scale", labels:["Never used it","Use it routinely"] },
  { id:"q6", text:"What would be most helpful for improving your CC documentation? (select all that apply)", type:"multi", options:["A list of cases that commonly qualify","SmartPhrase / dot-phrase templates","One-on-one chart review feedback","Examples of what a good CC note looks like","Knowing my own CC rate vs. peers","A short reference card for the ED"] },
  { id:"q7", text:"Any other thoughts on critical care billing, documentation, or what would help the group? (optional)", type:"text", placeholder:"Free text — anything goes..." },
];

// ── Survey ────────────────────────────────────────────────────────────────────
function Survey() {
  const [step, setStep]         = useState(0);
  const [name, setName]         = useState("");
  const [answers, setAnswers]   = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [saving, setSaving]     = useState(false);
  const [saveErr, setSaveErr]   = useState("");

  const q = QUESTIONS[step - 1];
  const progress = step === 0 ? 0 : (step / (QUESTIONS.length + 1)) * 100;

  function setAnswer(id, val) { setAnswers(a => ({ ...a, [id]: val })); }
  function toggleMulti(id, opt) {
    setAnswers(a => {
      const cur = a[id] || [];
      return { ...a, [id]: cur.includes(opt) ? cur.filter(x => x !== opt) : [...cur, opt] };
    });
  }
  function canAdvance() {
    if (step === 0) return name.trim().length > 0;
    if (!q) return false;
    if (q.type === "text") return true;
    if (q.type === "scale") return answers[q.id] != null;
    if (q.type === "single") return answers[q.id] != null;
    if (q.type === "multi") return (answers[q.id] || []).length > 0;
    return false;
  }
  async function handleSubmit() {
    setSaving(true); setSaveErr("");
    try { await saveToAirtable(name.trim(), answers); setSubmitted(true); }
    catch(e) { setSaveErr(e.message || "Something went wrong — please try again."); }
    setSaving(false);
  }

  if (submitted) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#080e14",padding:24}}>
      <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:16,padding:"48px 40px",maxWidth:480,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:52,marginBottom:20}}>✓</div>
        <div style={{fontSize:22,fontWeight:700,color:"#f1f5f9",marginBottom:10}}>Thanks, {name}.</div>
        <div style={{fontSize:14,color:"#475569",lineHeight:1.7,maxWidth:340,margin:"0 auto"}}>Your responses are saved. Casey will review everything and follow up as the program evolves.</div>
        <div style={{marginTop:32,fontSize:11,color:"#1e2a3a"}}>For QI/educational use only · CritcareIQ · Mercy Fitzgerald O52</div>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#080e14",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(180deg,#0d1a26,#080e14)",borderBottom:"1px solid #1a2a3a",padding:"18px 32px",display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:40,height:40,background:"linear-gradient(135deg,#c8102e,#7b0019)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,boxShadow:"0 0 20px rgba(200,16,46,.3)"}}>⚕</div>
        <div>
          <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9",letterSpacing:"-0.3px"}}>CritCareIQ</div>
          <div style={{fontSize:11,color:"#475569",letterSpacing:"0.5px"}}>MERCY FITZGERALD · O52 · CC DOCUMENTATION SURVEY</div>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{height:3,background:"#1a2a3a",overflow:"hidden"}}>
        <div style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#c8102e,#4a9eff)",transition:"width 0.4s ease"}}/>
      </div>

      <div style={{flex:1,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 24px"}}>
        <div style={{width:"100%",maxWidth:680}}>

          {/* Name step */}
          {step === 0 && (
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:16,padding:"32px 36px"}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#334155",textTransform:"uppercase",marginBottom:10}}>Before we start</div>
              <div style={{fontSize:20,fontWeight:600,color:"#f1f5f9",lineHeight:1.4,marginBottom:24}}>What's your name?</div>
              <input value={name} onChange={e=>setName(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&name.trim()&&setStep(1)}
                placeholder="First name is fine..."
                style={{width:"100%",background:"#0f1923",border:"1px solid #2a3a4a",borderRadius:8,padding:"13px 16px",color:"#e2e8f0",fontSize:16,fontFamily:"'DM Sans',sans-serif",outline:"none"}}/>
              <div style={{display:"flex",justifyContent:"flex-end",marginTop:20}}>
                <button onClick={()=>setStep(1)} disabled={!name.trim()}
                  style={{background:name.trim()?"linear-gradient(135deg,#c8102e,#7b0019)":"#1a2a3a",border:"none",borderRadius:8,padding:"12px 28px",color:name.trim()?"#fff":"#334155",fontSize:13,fontWeight:600,cursor:name.trim()?"pointer":"not-allowed",fontFamily:"'DM Sans',sans-serif",letterSpacing:"0.5px"}}>
                  Start →
                </button>
              </div>
            </div>
          )}

          {/* Question steps */}
          {step > 0 && step <= QUESTIONS.length && q && (
            <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:16,padding:"32px 36px"}}>
              <div style={{fontSize:11,letterSpacing:3,color:"#334155",textTransform:"uppercase",marginBottom:10}}>
                Question {step} of {QUESTIONS.length}
              </div>
              <div style={{fontSize:19,fontWeight:600,color:"#f1f5f9",lineHeight:1.45,marginBottom:24}}>{q.text}</div>

              {q.type === "scale" && (
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,color:"#475569"}}>{q.labels[0]}</span>
                    {[1,2,3,4,5].map(v=>(
                      <button key={v} className="scale-btn" onClick={()=>setAnswer(q.id,v)}
                        style={{width:48,height:48,borderRadius:"50%",border:`2px solid ${answers[q.id]===v?"#4a9eff":"#2a3a4a"}`,background:answers[q.id]===v?"#162535":"transparent",color:answers[q.id]===v?"#4a9eff":"#475569",fontSize:17,fontWeight:600}}>
                        {v}
                      </button>
                    ))}
                    <span style={{fontSize:12,color:"#475569"}}>{q.labels[1]}</span>
                  </div>
                </div>
              )}

              {(q.type === "multi" || q.type === "single") && (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {q.options.map(opt => {
                    const sel = q.type === "multi" ? (answers[q.id]||[]).includes(opt) : answers[q.id]===opt;
                    return (
                      <button key={opt} className="opt-btn"
                        onClick={()=>q.type==="multi"?toggleMulti(q.id,opt):setAnswer(q.id,opt)}
                        style={{display:"flex",alignItems:"center",gap:12,background:sel?"#0d1f35":"#0f1923",border:`1px solid ${sel?"#4a9eff":"#1a2a3a"}`,borderRadius:8,padding:"12px 16px",color:"#e2e8f0",fontSize:14}}>
                        <div style={{width:18,height:18,borderRadius:q.type==="multi"?"4px":"50%",border:`2px solid ${sel?"#4a9eff":"#2a3a4a"}`,background:sel?"#4a9eff":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {sel && <span style={{color:"#fff",fontSize:11,fontWeight:700}}>✓</span>}
                        </div>
                        {opt}
                      </button>
                    );
                  })}
                </div>
              )}

              {q.type === "text" && (
                <textarea value={answers[q.id]||""} onChange={e=>setAnswer(q.id,e.target.value)}
                  placeholder={q.placeholder}
                  style={{width:"100%",minHeight:110,background:"#0f1923",border:"1px solid #1a2a3a",borderRadius:8,padding:"13px 16px",color:"#e2e8f0",fontSize:14,fontFamily:"'DM Sans',sans-serif",resize:"vertical",outline:"none"}}/>
              )}

              {saveErr && <div style={{marginTop:12,fontSize:13,color:"#f87171"}}>⚠ {saveErr}</div>}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:28}}>
                <button onClick={()=>setStep(s=>s-1)}
                  style={{background:"transparent",border:"1px solid #1a2a3a",borderRadius:8,padding:"10px 22px",color:"#475569",fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                  ← Back
                </button>
                {step < QUESTIONS.length
                  ? <button onClick={()=>setStep(s=>s+1)} disabled={!canAdvance()}
                      style={{background:canAdvance()?"linear-gradient(135deg,#c8102e,#7b0019)":"#1a2a3a",border:"none",borderRadius:8,padding:"11px 28px",color:canAdvance()?"#fff":"#334155",fontSize:13,fontWeight:600,cursor:canAdvance()?"pointer":"not-allowed",fontFamily:"'DM Sans',sans-serif",letterSpacing:"0.5px"}}>
                      Next →
                    </button>
                  : <button onClick={handleSubmit} disabled={saving||!canAdvance()}
                      style={{background:(!saving&&canAdvance())?"linear-gradient(135deg,#c8102e,#7b0019)":"#1a2a3a",border:"none",borderRadius:8,padding:"11px 28px",color:(!saving&&canAdvance())?"#fff":"#334155",fontSize:13,fontWeight:600,cursor:(!saving&&canAdvance())?"pointer":"not-allowed",fontFamily:"'DM Sans',sans-serif",letterSpacing:"0.5px"}}>
                      {saving?"Saving...":"Submit →"}
                    </button>
                }
              </div>
            </div>
          )}

          <div style={{marginTop:24,fontSize:11,color:"#1e2a3a",textAlign:"center"}}>
            Responses stored securely for QI review by Casey · CritcareIQ · Mercy Fitzgerald O52
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Admin ─────────────────────────────────────────────────────────────────────
function Admin() {
  const [unlocked, setUnlocked] = useState(false);
  const [pw, setPw]             = useState("");
  const [pwErr, setPwErr]       = useState(false);
  const [responses, setResponses] = useState(null);
  const [loading, setLoading]   = useState(false);
  const [selected, setSelected] = useState(null);

  function handleUnlock() {
    if (pw === ADMIN_PASSWORD) { setUnlocked(true); load(); }
    else { setPwErr(true); setPw(""); setTimeout(()=>setPwErr(false),2000); }
  }

  async function load() {
    setLoading(true);
    try { setResponses(await fetchFromAirtable()); }
    catch(e) { setResponses([]); }
    setLoading(false);
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
  }
  function avg(field) {
    if (!responses?.length) return "—";
    const vals = responses.map(r=>r[field]).filter(v=>typeof v==="number");
    if (!vals.length) return "—";
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  }
  function topOpts(field, n=3) {
    if (!responses?.length) return [];
    const counts = {};
    responses.forEach(r => { (r[field]||"").split(", ").filter(Boolean).forEach(o=>{ counts[o]=(counts[o]||0)+1; }); });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }

  if (!unlocked) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#080e14",padding:24}}>
      <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:16,padding:"48px 40px",maxWidth:380,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:16}}>🔒</div>
        <div style={{fontSize:20,fontWeight:700,color:"#f1f5f9",marginBottom:6}}>Admin Access</div>
        <div style={{fontSize:13,color:"#475569",marginBottom:28}}>Enter password to view responses</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&handleUnlock()} placeholder="Password"
          style={{width:"100%",background:"#0f1923",border:`1px solid ${pwErr?"#c8102e":"#2a3a4a"}`,borderRadius:8,padding:"12px 16px",color:"#e2e8f0",fontSize:15,fontFamily:"'DM Mono',monospace",outline:"none",textAlign:"center",letterSpacing:2,marginBottom:10}}/>
        {pwErr && <div style={{fontSize:12,color:"#f87171",marginBottom:10}}>Incorrect password</div>}
        <button onClick={handleUnlock}
          style={{width:"100%",background:"linear-gradient(135deg,#c8102e,#7b0019)",border:"none",borderRadius:8,padding:12,color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
          Unlock →
        </button>
      </div>
    </div>
  );

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#080e14"}}>
      <div style={{color:"#4a9eff",fontSize:14,letterSpacing:1}}>Loading from Airtable...</div>
    </div>
  );

  if (selected) {
    const r = responses.find(x=>x.id===selected);
    return (
      <div style={{minHeight:"100vh",background:"#080e14",padding:"32px 24px"}}>
        <div style={{maxWidth:680,margin:"0 auto"}}>
          <button onClick={()=>setSelected(null)}
            style={{background:"transparent",border:"1px solid #1a2a3a",borderRadius:6,padding:"8px 18px",color:"#475569",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",marginBottom:20}}>
            ← All Responses
          </button>
          <div style={{background:"#0a1520",border:"1px solid #2a4a6a",borderRadius:16,padding:"28px 32px"}}>
            <div style={{fontSize:20,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>{r.name}</div>
            <div style={{fontSize:11,color:"#334155",letterSpacing:1,marginBottom:24}}>{fmtDate(r.timestamp)}</div>
            {QUESTIONS.map(q=>(
              <div key={q.id} style={{marginBottom:20,paddingBottom:20,borderBottom:"1px solid #0f1923"}}>
                <div style={{fontSize:12,color:"#4a7a9a",fontStyle:"italic",marginBottom:6}}>{q.text}</div>
                <div style={{fontSize:14,color:"#e2e8f0",lineHeight:1.6}}>{r[q.id]||<span style={{color:"#334155"}}>—</span>}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:"100vh",background:"#080e14",padding:"32px 24px"}}>
      <div style={{maxWidth:900,margin:"0 auto"}}>
        {/* Admin header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:18,fontWeight:700,color:"#f1f5f9"}}>Survey Responses</div>
            <div style={{fontSize:12,color:"#475569",marginTop:2}}>{(responses||[]).length} response{(responses||[]).length!==1?"s":""} collected</div>
          </div>
          <button onClick={load}
            style={{background:"transparent",border:"1px solid #1a2a3a",borderRadius:6,padding:"8px 18px",color:"#475569",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
            ↻ Refresh
          </button>
        </div>

        {!responses?.length ? (
          <div style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:12,padding:"48px 24px",textAlign:"center",color:"#334155"}}>
            No responses yet. Share the survey URL with your group.
          </div>
        ) : (
          <>
            {/* Stats */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:24}}>
              {[
                {label:"Total Responses", value:responses.length, color:"#4a9eff"},
                {label:"Avg CC Confidence", value:`${avg("q1")}/5`, color:"#4ade80"},
                {label:"Avg EPIC Familiarity", value:`${avg("q5")}/5`, color:"#facc15"},
              ].map((s,i)=>(
                <div key={i} style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:10,padding:"18px 20px",textAlign:"center"}}>
                  <div style={{fontSize:28,fontWeight:700,color:s.color,fontFamily:"'DM Mono',monospace",marginBottom:4}}>{s.value}</div>
                  <div style={{fontSize:11,color:"#475569",letterSpacing:1,textTransform:"uppercase"}}>{s.label}</div>
                </div>
              ))}
            </div>

            {/* Top answers */}
            {[
              {field:"q3", label:"Cases typically billed as CC"},
              {field:"q4", label:"Most common reason for not billing CC"},
              {field:"q6", label:"What would help most"},
            ].map(({field,label})=>{
              const top = topOpts(field);
              if (!top.length) return null;
              return (
                <div key={field} style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:10,padding:"18px 20px",marginBottom:14}}>
                  <div style={{fontSize:12,color:"#4a7a9a",fontStyle:"italic",marginBottom:12}}>{label}</div>
                  {top.map(([opt,count])=>(
                    <div key={opt} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <div style={{fontSize:13,color:"#c8d8e8",flex:1,paddingRight:12}}>{opt}</div>
                      <div style={{fontSize:12,color:"#4a9eff",flexShrink:0,fontFamily:"'DM Mono',monospace"}}>{count} ({Math.round(count/responses.length*100)}%)</div>
                    </div>
                  ))}
                </div>
              );
            })}

            {/* Individual list */}
            <div style={{fontSize:11,color:"#334155",letterSpacing:2,textTransform:"uppercase",margin:"24px 0 12px"}}>Individual Responses</div>
            {responses.map(r=>(
              <div key={r.id} onClick={()=>setSelected(r.id)}
                style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:10,padding:"18px 20px",marginBottom:10,cursor:"pointer",transition:"border-color 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#4a9eff"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#1a2a3a"}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div style={{fontSize:15,fontWeight:600,color:"#f1f5f9"}}>{r.name}</div>
                  <div style={{fontSize:11,color:"#334155"}}>{fmtDate(r.timestamp)}</div>
                </div>
                <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:r.q7?8:0}}>
                  <div style={{fontSize:12,color:"#475569"}}>Confidence: <span style={{color:"#4ade80",fontFamily:"'DM Mono',monospace"}}>{r.q1??'—'}/5</span></div>
                  <div style={{fontSize:12,color:"#475569"}}>EPIC familiarity: <span style={{color:"#facc15",fontFamily:"'DM Mono',monospace"}}>{r.q5??'—'}/5</span></div>
                  <div style={{fontSize:12,color:"#475569"}}>Barrier: <span style={{color:"#e2e8f0"}}>{r.q4||"—"}</span></div>
                </div>
                {r.q7 && <div style={{fontSize:12,color:"#475569",fontStyle:"italic"}}>"{r.q7.slice(0,120)}{r.q7.length>120?"...":""}"</div>}
              </div>
            ))}
          </>
        )}

        <div style={{marginTop:32,fontSize:11,color:"#1e2a3a",textAlign:"center"}}>
          Admin view · CritcareIQ · Mercy Fitzgerald O52 · For QI use only
        </div>
      </div>
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("survey");
  return (
    <div>
      <div style={{position:"fixed",bottom:20,right:20,zIndex:100}}>
        <button onClick={()=>setView(v=>v==="survey"?"admin":"survey")}
          style={{background:"#0a1520",border:"1px solid #1a2a3a",borderRadius:8,padding:"8px 16px",color:"#334155",fontSize:11,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",letterSpacing:1}}>
          {view==="survey"?"Admin ↗":"← Survey"}
        </button>
      </div>
      {view === "survey" ? <Survey/> : <Admin/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
